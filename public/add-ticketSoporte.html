<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registro de Ticket Soporte</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> <!-- Add your custom CSS -->
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar" id="top-bar-register">
        <img src="images/banner.png" alt="Company Logo" class="logo">
    </div>

    <!-- Registration Form Container -->
    <div class="registration-container"> <!-- Same box as before, without logo inside -->
        <form id="register-form">
            <h3 class="mb-4 text-center">Ticket</h3> <!-- Page title -->
            <div class="mb-3">
                <select id="dynamic-dropdown-tipo">
                    <option value="">Seleccione un Tipo</option> <!-- Default placeholder option -->
                </select>
            </div>
            <div class="mb-3">
                <select id="dynamic-dropdown-subtipo">
                    <option value="">Seleccione Subtipo</option> <!-- Default placeholder option -->
                </select>
            </div>
            <div class="mb-3">
                <textarea class="form-control" id="descripcion" placeholder="Descripción" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="cedulaCliente" placeholder="Cédula del cliente" required>
            </div>
            <button type="submit" class="btn btn-primary btn-register w-100">Registrar</button> <!-- Full width button -->
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/add-ticketSoporte.js"></script> <!-- Link to your JS file -->
</body>

</html>
