<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css"> <!-- Custom styles -->
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar" id="top-bar-users">
        <img src="images/banner.png" alt="Company Logo" class="logo">
    </div>

    <!-- User List Container -->
    <div class="container mt-4 user-container">
        <div class="row justify-content-center">
            <div class="col-md-8 user-table">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary" id="goBack-button">
                                <i class="bi bi-arrow-90deg-left"></i> Regresar
                            </button>
                            <button type="button" class="btn btn-primary" id="add-user-button">
                                Agregar <i class="bi bi-plus"></i>
                            </button>
                        </div>
                        <div class="ms-auto">
                            <input class="form-control" id="userSearchInput" type="text"
                                placeholder="Buscar tipo de incidencia...">
                        </div>
                    </div>              
                    <div class="card-body">
                        <!-- Responsive Table -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover users-table">
                                <thead>
                                    <tr>
                                        <th>Tipo de incidencia</th>
                                        <th>Subtipo de incidencia</th>
                                        <th>Descripción</th>
                                        <th>Cédula Cliente</th>
                                        <th>Estatus</th>
                                        <th>Reportado por</th>
                                        <th id="acciones">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="user-table-body">
                                    <!-- User data will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- Pagination controls will appear here -->
                    <div id="pagination" class="card-footer d-flex justify-content-center"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/list-ticketSoporte.js"></script> <!-- Your custom JS -->
</body>

</html>
